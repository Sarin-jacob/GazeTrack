<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaze Calibration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gaze-dot"></div>

    <div id="stage">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>


        <div id="calibration-overlay">
            <div id="cal-status">Look at the point</div>
            <div id="cal-point"></div>
        </div>
    </div>

    <div id="controls">
        <button id="toggle-video-btn" autofocus>Start Video</button>
        <button id="start-cal-btn" disabled>Start Calibration</button>
        <button id="clear-cal-btn">Clear Data</button>
        <div id="status-text">Status: Waiting</div>
    </div>

    <script type="module" src="main.js"></script>
    <script src="debug.js"></script>

</body>
</html>
