<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaze Calibration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gaze-dot"></div>
 <main id="app-wrapper">
    <div id="stage">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>


        <div id="calibration-overlay">
            <div id="rec-badge">Recording to this computer</div>
            <div id="cal-intro">
                <h2>Before you start</h2>
                <ul id="cal-intro-list"></ul>
                <button id="cal-begin">Begin</button>
            </div>
            <div id="head-guide"><div id="head-marker"></div></div>
            <div id="cal-status"></div>
            <div id="cal-point"></div>
        </div>
    </div>

    <div id="controls">
        <button id="toggle-video-btn" autofocus>Start Video</button>
        <button id="start-cal-btn" disabled>Start Calibration</button>
        <button id="test-btn" disabled>Test Accuracy</button>
        <button id="clear-cal-btn">Clear Data</button>
        <label>Pointer
            <select id="pointer-mode">
                <option value="both">Eyes + head</option>
                <option value="eyes">Eyes only</option>
                <option value="head">Head only</option>
            </select>
        </label>
        <div id="status-text">Status: Waiting</div>
    </div>
</main>
    <script type="module" src="main.js"></script>
    <script src="debug.js"></script>

</body>
</html>
